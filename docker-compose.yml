services:

  app:
    build: .
    container_name: java-app
    ports:
      - "8080:8080"
    depends_on:
     database:
      condition: service_healthy
      
    restart: unless-stopped

  database:
  image: postgres:16
  container_name: postgres-db
  environment:
    POSTGRES_DB: demo
    POSTGRES_USER: demo
    POSTGRES_PASSWORD: demo123

  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
    interval: 10s
    timeout: 5s
    retries: 5

  volumes:
    - postgres-data:/var/lib/postgresql/data

  restart: unless-stopped